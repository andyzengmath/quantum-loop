# Multi-runner manifest example (US-005 / v0.7.4)
# Foundation only — runner integrations land in v0.8.0+.
runners:
  - name: claude
    command: claude
    version_flag: --version
  - name: codex
    command: codex
    version_flag: --version
  - name: gemini
    command: gemini-cli
    version_flag: --version
